# 配布物の作り方（セルフホスト化設計§14-3・§25）。
#
# `dist`（旧 cargo-dist）が読む設定。3 OS 分のアーカイブとワンライナーのインストーラを
# 作り、それを作るための GitHub Actions のワークフローも生成する。
#
# # なぜここに置くのか
#
# cargo の workspace は `server/` にあり、git のルートはここ。`dist-workspace.toml` は
# この入れ子を表現できる唯一の形で、`members` に「どの言語のどこ」を並べる（§25 読み替え5）。
#
# # 触ったら
#
# `make dist-check` を通すこと。生成物の一覧（`dist plan`）と、生成済みのワークフローが
# 設定と食い違っていないこと（`dist generate --check`）を見る。**ワークフローを手で
# 書き換えない**——次の生成で黙って戻る。

[workspace]
members = ["cargo:server"]

[dist]
# 生成に使った dist の版。**docker/Dockerfile.rust が入れる版と揃えること**。
# 食い違うと `dist generate --check` が落ちて気づける
cargo-dist-version = "0.32.0"

# 配布物を作る場所
ci = "github"

# 3 OS 分。macOS は universal を作らず、x86_64 と aarch64 を別々に作って
# インストーラが選ぶ（§25 読み替え7）
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# ワンライナーの2種類だけ。homebrew・npm・msi は利用者の前提を増やすので作らない
installers = ["shell", "powershell"]

# 入れる場所。**~/.cargo/bin にしない**——利用者に Rust が入っている前提を持ち込まない。
# PATH への追加はインストーラが面倒を見る
install-path = "~/.local/bin"

# **cargo の前に web をビルドする**（§25 読み替え6）。`agentdashboard` は web/dist を
# コンパイル時に焼き込むので、これが無いと**起動はするが画面が空**のバイナリができる。
#
# パスは `.github/workflows/` からの相対。**1つ上へ置いてある**のは、これが
# 差し込む断片であって単体で走らせるものではないため——`.github/workflows/` に
# 置くと GitHub がワークフローとして登録し、`on:` が無いので**プッシュのたびに
# 失敗が1件積み上がる**（実際にそうなった）。中身は変えずに場所だけ移せば消える
github-build-setup = "../build-setup.yml"

# セルフホストのサーバを箱（コンテナイメージ）としても配る（設計§26 読み替え2）。
# 実体は `.github/workflows/docker-image.yml`。**中でビルドし直さず**、ここで作った
# 実行ファイルをそのまま入れるので、配ったものと箱の中身が同一になる。
#
# 権限は別途足す必要がある。**呼び出し側が渡す以上の権限は取れない**ので、
# 呼ばれる側にだけ書いても push が 403 になる
publish-jobs = ["./docker-image"]
github-custom-job-permissions = { "docker-image" = { contents = "read", packages = "write" } }

# アーカイブに入れる読み物。手順はここから辿れる。
# **自動の拾い上げは切る**——入れるものをこの1行で読み切れるようにするため
# （切らないと同じ README が2回入る）
auto-includes = false
include = ["README.md", "docs/setup"]

# 配布ツールの自動更新は使わない。**更新の仕組みは自前で持っている**（CICD設計§3・§4）。
#
# あちらは `~/.local/bin` の実行ファイルを上書きする作りだが、配るのは3本で1本ずつしか
# 置き換えられないので「1本だけ入れ替わった瞬間」が必ず生まれる。パーサは実行ファイルの
# 隣を探すため、そこで**落としてもいないのに食い違ったパーサが起動する**。
#
# こちらは上書きせず、版ごとに保管して起動時に乗り換える。3本が同じ場所に居るので
# 版揃いが構造的に保証され、入れる側と消す側の持ち物にも触らない
install-updater = false

# 消す道もリリースへ上げる（設計§27）。**dist のインストーラに消す機能は無い**ので、
# 自前で書いたものを、入れる側と同じ形（ワンライナー）で配る。
#
# リポジトリでの名前は `uninstall.sh` だが、配る名前は `agentdashboard-installer.sh` と
# 揃える——利用者が並べて見たときに、対になっていると分かるようにするため。
[[dist.extra-artifacts]]
artifacts = ["agentdashboard-uninstaller.sh"]
build = ["cp", "scripts/uninstall.sh", "agentdashboard-uninstaller.sh"]

[[dist.extra-artifacts]]
artifacts = ["agentdashboard-uninstaller.ps1"]
build = ["cp", "scripts/uninstall.ps1", "agentdashboard-uninstaller.ps1"]

# ビルドに使う Rust は `server/rust-toolchain.toml` で決める。ここに書く
# `rust-toolchain-version` は非推奨で、手元（隔離イメージ）と CI で版がずれる
