[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/session-host-core",
    "crates/server-core",
    "crates/core",
    "crates/session-host",
    "crates/transcript-parser",
    "crates/testkit",
    # 利用者へ配る一式。実行ファイル3本を1つのアーカイブへ入れるための集合場所で、
    # 中身は持たない（セルフホスト化設計§25 読み替え1）
    "crates/dist",
]

[workspace.package]
version = "0.1.48"
edition = "2024"
rust-version = "1.85"
publish = false

# 依存バージョンはここで一元管理する（設計§14 のバージョンピン方針）。
# 各クレートは `foo.workspace = true` で参照すること。
[workspace.dependencies]
protocol = { path = "crates/protocol" }
session-host-core = { path = "crates/session-host-core" }
server-core = { path = "crates/server-core" }
testkit = { path = "crates/testkit" }

serde = { version = "1", features = ["derive"] }
# `raw_value` は CLI が「サーバの応答をそのまま出す」（CLI設計§10-2）ために要る。
# `Value` を経由すると鍵が辞書順へ並び替わり、整形も変わる
serde_json = { version = "1", features = ["raw_value"] }
# axum の WebSocket ペイロードと同じ型。1つの Bytes を clone（参照カウントのみ）して
# 全クライアントへ配る、設計§4 のゼロコピー配信のために使う。
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# axum 0.8 系。WebSocket の Message が Bytes ペイロードを持つ世代であることが
# 設計§4 のゼロコピー配信の前提（scripts/cargo tree で確認する）。
axum = { version = "0.8", features = ["ws"] }
# axum の WebSocket を送信側・受信側へ分割し、送信をタスク1つに集約するために使う
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# サーバ側と PC 側の境界（`server_core::agent::SessionHost`）を `Arc<dyn _>` で持つために使う。
# Rust の `async fn` はトレイトに書けるが、**dyn にすると呼べない**（返る Future の大きさが
# 決まらないため）。境界の向こうがローカル直結か A2S 越しかを実行時に差し替えるのが
# セルフホスト化の要なので、ここは dyn である必要がある。
async-trait = "0.1"
# debug-embed を付けているのは、デバッグビルドでも「コンパイル時に埋め込む」ため。
# 既定ではデバッグ時だけ実行時にフォルダを読みに行く挙動になり、cargo をコンテナで
# 動かしている本PJTではコンテナ内の絶対パスを探して失敗する（ホストには存在しない）。
rust-embed = { version = "8", features = ["debug-embed"] }
portable-pty = "0.9"
# 擬似 claude（testkit）が SIGWINCH と TIOCGWINSZ を扱うためだけの低水準の口。
# portable-pty が同じ版を既に引いているので、木に新しい crate は増えない
libc = "0.2"
# DB（セルフホスト化設計§3-2）。**server-core だけが持つ**——PC 側が DB を触ると、
# 「セッションの実体は PC・記録はサーバ」という分け方が崩れる。境界は
# crates/core/tests/dependencies.rs が機械で検査する。
#
# ドライバを2つとも入れているのは、**ローカルは SQLite・セルフホストは PostgreSQL で
# スキーマとコードを共有する**ため（設計§3-2 の「共有するのはスキーマ」）。
# 片方だけ入れて他方を feature で切り替える形にすると、同じテストコードを両方へ
# 通す（テスト計画F2）ができなくなる。
sea-orm = { version = "2", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-json",
] }
sea-orm-migration = { version = "2", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
# A2S（セルフホスト化設計§4-1）の WebSocket **クライアント**。**PC 側だけが持つ**——
# 接続は常に PC から張るので、サーバ側は axum の upgrade だけで足りる。
#
# 版を "0.29" に固定しているのは、**axum 0.8.9 が内部で使っているのと同じ版**だから。
# 別の版を書くと同じ実装が2つビルドされ、配布バイナリ（設計§14-3）が理由もなく太る。
# axum を上げるときは `scripts/cargo tree -i tungstenite` で揃っているか見ること。
#
# TLS を入れてあるのは、セッションホストがインターネット越しに繋ぐため（設計§14-2 の
# リバースプロキシ構成では `wss://` になる）。native-tls ではなく rustls を選ぶのは、
# musl 静的リンク（設計§14-3）で OpenSSL を引き込まないため。
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# CLI がダッシュボードを叩く HTTP クライアント（CLI設計§6-1）。**新しい実装は木に増えない**
# ——hyper 系3つは axum が、TLS の2つは tokio-tungstenite の rustls-tls-webpki-roots が、
# それぞれ既に引き込んでいるものへ機能を足すだけ。reqwest を入れないのは配布物の嵩のため。
# 手書きの fetch（logs.rs）を育てない理由は CLI設計§15-1——前段が応答を chunked へ
# 組み替えうるので、Content-Length 必須の読み方は利用者の設定1行で全滅する。
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
# 暗号の実装は **ring を名指しする**。既定（aws-lc-rs）のままだと、tungstenite が
# 既に ring でビルドしている rustls と別の実装が並び、lock に新しい crate が増える。
#
# `tls12` も `logging` も**足さない**。feature はワークスペース全体で統一されるので、
# ここで足すと A2S（tungstenite 経由の rustls）を持つ agentdashboard-agent まで太る
# （tls12 を足した実測で +99KB。外すと基線±0.3KB へ戻った）。つまり TLS は 1.3 のみ——
# これは A2S の `wss://` が元からそうで、CLI も同じ線に揃えている。
# 1.2 しか話せない前段に会ったら、そのとき太る覚悟で足すこと。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
# ペアリングトークンの見た目（設計§8-4）。利用者が agent.toml へ貼る文字列なので、
# 16進（64文字）より短い base64url（43文字）にする。
base64 = "0.22"
# ペアリングトークンの照合（設計§8-4）。**低速ハッシュにしない**——トークンは 256bit の
# 乱数なので辞書攻撃が成立せず、接続のたびにハッシュ一致で引ける必要があるため。
# 利用者のパスワード（argon2id）とは要求が違うので、同じ道具を使い回さない。
sha2 = "0.10"
# ブラウザのログインのパスワード照合（設計§8-2）。argon2id と OWASP 推奨のパラメータを
# 内蔵しており、こちらでコスト値を決めなくてよい。**ペアリングトークンとは道具を分ける**——
# あちらは 256bit の乱数で辞書攻撃が成立しないので速いハッシュ（sha2）、こちらは利用者が
# 決める短い文字列なので意図的に遅いハッシュ、と要求が逆になる。
password-auth = "1"
# ブラウザのログインセッション（設計§8-2）。**フェーズ2 で入れるのは置き場所（web_sessions）
# の実装だけ**で、ログインへの結線はフェーズ5。既製の tower-sessions-sqlx-store を使わない
# 理由は設計§8-2（更新停止・版の非互換・sqlx の二重ビルド）。
tower-sessions = "0.15"
# インスタンスの間の連絡係（セルフホスト化設計§9-1）。**server-core だけが持つ**——
# PC 側が持つと、配布するセッションホストに要らない荷物が増える（設計§14-3 の musl 静的リンク）。
# 境界は crates/core/tests/dependencies.rs が機械で検査する。
#
# 設計は 1.4.1 を挙げているが、確認した時点で 1.5.0 が出ている。使う API
# （`set_automatic_resubscription` / `set_push_sender`）は同じ。
#
# 既定の機能を切っているのは、使うのが publish / subscribe と sorted set だけだから。
# ACL・ストリーム・地理情報・スクリプトは1つも要らない。
redis = { version = "1.5", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }
# 端末エミュレータ（セルフホスト化設計§7-1）。フェーズ0 の実機検証では**まだ dev-dependency**
# で、録画を食わせて再現性と画面サイズを測るためだけに使う。製品コードへ入るのはフェーズ4。
# 依存を「使うフェーズまで入れない」方針どおり、通常依存への昇格もそのときに行う。
vt100 = "0.16"
notify = "8"
# 暦の計算。トランスクリプトの ISO8601 タイムスタンプを epoch ミリ秒へ直す（parser）のと、
# ログの1行の `ts` を組む（session-host-core の logging）のに使う。自前で書くと閏年の
# 周りで静かに間違え、画面の「N分前」やログの並び順がずれる形でしか気づけない。
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ログをファイルへ落とす層（ログ設計§4-2・§6-1）。日次ローテーションと、書き手を
# 止めない書き出しを持つ。**持つのは session-host-core だけ**——ログの出力層を組むのは
# あそこ1箇所で、他は `tracing` のマクロを呼ぶだけ。
#
# 配布バイナリへの増分は +254 KiB（+3.6%。ログ設計§19-7 で実測）。
tracing-appender = "0.2"
# ログを読む口の `--grep` と、外へ貼るときに伏せる口（`--sanitize`）が使う
# （ログ設計§11-1・§14-2）。**`unicode` を切ってある**——日本語の literal 一致には
# 要らず、文字クラスのテーブルだけが重いため。
#
# 中身の大半（`regex-automata` / `regex-syntax` / `aho-corasick`）は
# `tracing-subscriber` の `env-filter` 経由で**既に配布バイナリへ入っている**ので、
# 増えるのは外皮だけ。増分は実測してログ設計へ記録する。
regex = { version = "1", default-features = false, features = ["std"] }

# **デバッグ情報を行番号だけに絞る。**
#
# 既定（`debug = true`）だと、テストの実行ファイル1本が 300 MB を超える。この
# ワークスペースは統合テストが多く、cargo は**古い成果物を自分では消さない**ので、
# 再ビルドのたびに別名の 300 MB が `target/debug/deps` へ積み上がっていく。
# 実際に 335 GB まで育ち、Windows の C: を満杯にして Docker ごと落とした
# （2026-08-09。掃除の口は `make prune`）。
#
# `line-tables-only` でも**パニックのバックトレースは file:line を保つ**ので、
# テストが落ちたときに現場を指す能力は変わらない。失うのはデバッガで変数を覗く
# ときの型情報で、本PJTの日常（`make test` と `make ci`）はそこを使っていない。
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
