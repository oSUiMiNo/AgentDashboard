[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/agent-core",
    "crates/server-core",
    "crates/core",
    "crates/agent",
    "crates/transcript-parser",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# 依存バージョンはここで一元管理する（設計§14 のバージョンピン方針）。
# 各クレートは `foo.workspace = true` で参照すること。
[workspace.dependencies]
protocol = { path = "crates/protocol" }
agent-core = { path = "crates/agent-core" }
server-core = { path = "crates/server-core" }
testkit = { path = "crates/testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# axum の WebSocket ペイロードと同じ型。1つの Bytes を clone（参照カウントのみ）して
# 全クライアントへ配る、設計§4 のゼロコピー配信のために使う。
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
toml = "0.9"
# 設定の書き戻し用。`toml::to_string` で構造体から書き直すとファイル中のコメントが
# 全部消える。config.toml.example は説明コメントが本体と言っていいほど厚く、利用者が
# それをコピーして使う前提なので、書式とコメントを保ったまま1キーだけ触れる必要がある。
toml_edit = "0.25"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# axum 0.8 系。WebSocket の Message が Bytes ペイロードを持つ世代であることが
# 設計§4 のゼロコピー配信の前提（scripts/cargo tree で確認する）。
axum = { version = "0.8", features = ["ws"] }
# axum の WebSocket を送信側・受信側へ分割し、送信をタスク1つに集約するために使う
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# サーバ側と PC 側の境界（`server_core::agent::AgentHost`）を `Arc<dyn _>` で持つために使う。
# Rust の `async fn` はトレイトに書けるが、**dyn にすると呼べない**（返る Future の大きさが
# 決まらないため）。境界の向こうがローカル直結か A2S 越しかを実行時に差し替えるのが
# セルフホスト化の要なので、ここは dyn である必要がある。
async-trait = "0.1"
# debug-embed を付けているのは、デバッグビルドでも「コンパイル時に埋め込む」ため。
# 既定ではデバッグ時だけ実行時にフォルダを読みに行く挙動になり、cargo をコンテナで
# 動かしている本PJTではコンテナ内の絶対パスを探して失敗する（ホストには存在しない）。
rust-embed = { version = "8", features = ["debug-embed"] }
portable-pty = "0.9"
notify = "8"
# トランスクリプトの ISO8601 タイムスタンプを epoch ミリ秒へ直すためだけに使う。
# 自前で暦の計算を書くと閏年やうるう秒の周りで静かに間違え、画面の「N分前」が
# ずれる形でしか気づけない。transcript-parser だけが依存する。
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
