[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/transcript-parser",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# 依存バージョンはここで一元管理する（設計§14 のバージョンピン方針）。
# 各クレートは `foo.workspace = true` で参照すること。
[workspace.dependencies]
protocol = { path = "crates/protocol" }
testkit = { path = "crates/testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# axum の WebSocket ペイロードと同じ型。1つの Bytes を clone（参照カウントのみ）して
# 全クライアントへ配る、設計§4 のゼロコピー配信のために使う。
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# axum 0.8 系。WebSocket の Message が Bytes ペイロードを持つ世代であることが
# 設計§4 のゼロコピー配信の前提（scripts/cargo tree で確認する）。
axum = { version = "0.8", features = ["ws"] }
# axum の WebSocket を送信側・受信側へ分割し、送信をタスク1つに集約するために使う
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# debug-embed を付けているのは、デバッグビルドでも「コンパイル時に埋め込む」ため。
# 既定ではデバッグ時だけ実行時にフォルダを読みに行く挙動になり、cargo をコンテナで
# 動かしている本PJTではコンテナ内の絶対パスを探して失敗する（ホストには存在しない）。
rust-embed = { version = "8", features = ["debug-embed"] }
portable-pty = "0.9"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
