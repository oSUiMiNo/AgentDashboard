[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/transcript-parser",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# 依存バージョンはここで一元管理する（設計§14 のバージョンピン方針）。
# 各クレートは `foo.workspace = true` で参照すること。
[workspace.dependencies]
protocol = { path = "crates/protocol" }
testkit = { path = "crates/testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# axum 0.8 系。WebSocket の Message が Bytes ペイロードを持つ世代であることが
# 設計§4 のゼロコピー配信の前提（scripts/cargo tree で確認する）。
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
portable-pty = "0.9"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
