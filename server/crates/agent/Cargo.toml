[package]
# セッションホストの中身（セルフホスト化設計§2-1）。
# 配布バイナリを軽く保つため、rust-embed（web アセットの同梱）は決して足さないこと。
# **この crate の依存グラフが、配るセッションホストの軽さの証明そのもの**
# （`crates/core/tests/dependencies.rs`）。実行ファイルは crates/dist が持つが、
# あちらは呼び出しの1行だけなので、証明の対象はここのままでよい。
name = "agentdashboard-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "agentdashboard_agent"
path = "src/lib.rs"

[dependencies]
agent-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
protocol.workspace = true
clap.workspace = true
serde_json.workspace = true
