[package]
# ダッシュボードサーバ側のロジック（セルフホスト化設計§2-1）。
# **PTY に触らない**のがこのクレートの存在理由で、`portable-pty` を依存に持たないことを
# crates/core/tests/dependencies.rs が機械で検査する。PC 側へは境界 trait
# （[`agent::SessionHost`]）越しにしか触れない。
name = "server-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "server_core"
path = "src/lib.rs"

[dependencies]
protocol.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
axum.workspace = true
futures-util.workspace = true
rust-embed.workspace = true
tracing.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
tower-sessions.workspace = true
password-auth.workspace = true
time.workspace = true
sha2.workspace = true
base64.workspace = true
redis.workspace = true

[dev-dependencies]
# セッションホストの受け口（`/agent/ws`）を**本物の WebSocket で**叩くため。製品コードの
# 依存には入れない——接続は常に PC 側から張るので、サーバ側にクライアントは要らない。
tokio-tungstenite.workspace = true
futures-util.workspace = true
# 越境の総当たり（設計§8-6）で、ブラウザの役として REST を Cookie 付きで叩くため。
# **依存を増やさない最小の HTTP** がここにある（testkit::request）
testkit.workspace = true
