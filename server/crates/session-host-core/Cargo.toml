[package]
# PC 側（セッションホスト）のロジック一式（セルフホスト化設計§2-1）。
# PTY と本物の CLI に触れてよいのはこのクレートだけで、その境界は
# 依存の宣言そのもので守る（crates/core/tests/dependencies.rs が機械で検査する）。
name = "session-host-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "session_host_core"
path = "src/lib.rs"

[dependencies]
protocol.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
# フックの受信口（`POST /hook/...` と `POST /model/...`）を出すために使う。
# ブラウザ向けの WebSocket は server-core の担当で、こちらには入れない。
axum.workspace = true
portable-pty.workspace = true
tracing.workspace = true
# ログの出力層（ログ設計§4-1）。**購読者を組むのはこのクレートだけ**で、
# `core` と `session-host` の両方がここへ依存しているから置ける。`server-core` は
# マクロを呼ぶだけなので、こちらを足してもあちらは太らない。
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# ログの1行の `ts`（RFC3339・ミリ秒・UTC）を組むため。tracing-appender が既に
# 引き込むので、コンパイル対象は増えない
time.workspace = true
# ダッシュボードサーバへの常時接続（A2S。セルフホスト化設計§4-1）。**接続は常に
# PC 側から張る**ので、クライアントを持つのはこのクレートだけ
tokio-tungstenite.workspace = true
futures-util.workspace = true
# セッションごとの端末エミュレータ（セルフホスト化設計§7-1）。**PC 側だけが持つ**——
# サーバへ漏れていないことは crates/core/tests/dependencies.rs が機械で見ている
vt100.workspace = true

[dev-dependencies]
testkit.workspace = true
