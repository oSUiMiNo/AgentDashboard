[package]
# PC 側（エージェント）のロジック一式（セルフホスト化設計§2-1）。
# PTY と本物の CLI に触れてよいのはこのクレートだけで、その境界は
# 依存の宣言そのもので守る（crates/core/tests/dependencies.rs が機械で検査する）。
name = "agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "agent_core"
path = "src/lib.rs"

[dependencies]
protocol.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio.workspace = true
# フックの受信口（`POST /hook/...` と `POST /model/...`）を出すために使う。
# ブラウザ向けの WebSocket は server-core の担当で、こちらには入れない。
axum.workspace = true
portable-pty.workspace = true
tracing.workspace = true

[dev-dependencies]
testkit.workspace = true
