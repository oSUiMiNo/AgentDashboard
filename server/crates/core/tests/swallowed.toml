# 結果を捨てている箇所の台帳（ログ設計§10-5）。
#
# ここは「見ていない」と「見て捨ててよいと判断した」を分けるためだけに在る。
# 一部だけ載せると分けられなくなるので、**製品コードの `let _ =` を全部**載せる。
# 一致は crates/core/tests/swallowed.rs が機械で見張る。理由が空なら落ちる。
#
# ## 鍵
#
# path + fn + expr。**行番号は使わない**——行は動くので、行番号を鍵にした台帳は
# 無関係な変更のたびに落ちて、やがて誰も読まなくなる。
# 同じ関数の中に字句的に同じ文が N 個あるときだけ count = N を書く。
#
# ## count を割りたくなったら
#
# count を分けるのではなく、**式か関数のほうを分ける**（変数名を変える・関数を切る）。
# 同じ関数の同じ文が違う意味を持っているなら、それはコードの側の問題である。
#
# ## class
#
# send         受け手が消えていることだけが失敗の原因。消えるのは正常な終わり方
# by-design    失敗し得るが、失敗しても呼び手にできることが無い（後片付け・二重停止）
# unused-value 捨てているのは失敗ではない。返り値の型に失敗が入っていない
# warn         **捨ててはいけないと判断した箇所**（設計§10-3）。
#              声を与えるとその行は `let _ =` でなくなり、台帳からも消える
#
# ## いま warn が1件も無いこと
#
# 設計§10-3 が名指しした7経路は、段3 で全部に声を与えた。**残っている warn の件数が、
# そのまま未着手の件数**になる。
#
# ## 注入できない箇所がある
#
# 端末へのキー送出（session/mod.rs の send_key）と、パーサへの停止指示・kill は、
# 失敗を作り出せないので回帰テストが無い。**書けないものは書けないと書く**——
# 前者は「子が居なくなっても端末への書き込みは失敗しない」を実測で固定してあり、
# 後者は生きている子への kill が Linux では実質失敗しないため。
#
# ## 並び順
#
# path → fn → expr の昇順。**位置ではなく名前で並べる**（行が動いても並びが変わらない）。

