# 直した振る舞いを守る台帳（設計§2）。
#
# ここは「一度直した振る舞い」を1行ずつ載せ、**それを守っているテストを名指しする**
# ためだけに在る。一致は crates/core/tests/regressions.rs が機械で見張る。
#
# ## なぜ在るのか
#
# `実行レポート.md` はテストを名指ししているが**散文なので機械は読まない**。だから
# 「このテストが消えたら、どのイシューが守られなくなるか」に誰も答えられなかった。
# 実際に、修正のコードもテスト8件も残ったまま再発した事例がある。
#
# ## 鍵
#
# issue + behavior。**行番号は使わない**——行は動くので、行番号を鍵にした台帳は
# 無関係な変更のたびに落ちて、やがて誰も読まなくなる。
#
# `issue` は `要件.md` のあるフォルダの相対パス（`クローズ/…`）。**イシューグループは
# 子ごと**に載せる（グループ自身は `要件.md` を持たないため）。
#
# **同じ `issue` の行が複数あってよい。** `クローズ/初期実装/` のように1イシューが
# 数十の振る舞いを持つものは、振る舞い単位で割る。
#
# ## 欄
#
# issue        どのイシューで直したか
# behavior     直した振る舞い。**「どの条件で」を含む1文**（検査が条件語を強制する）
# gate         unit ／ e2e ／ manual。**tests[].file から引いた門と食い違えば落ちる**
# tests        [{ file, name }]。manual 以外は必須
# manual_check 人がどう確かめるか。manual のときだけ必須。**空なら落ちる**
# breaks_when  閉じるときに**実際に壊した内容**
# retired      { by, on }。意図して覆したときだけ。**行は消さない**
#
# ## breaks_when は記録であって検査ではない
#
# **変異検査はやらない**（単体テストなら可能だが重い）ので、ここに書いてあることを
# 機械は確かめていない。確かめたのは**閉じるときの1回だけ**である。
# **「台帳が在るから守られている」と読まないこと。**
#
# ## 意図して覆すときは、行を消さずに畳む
#
# `retired = { by = "覆した側のイシュー", on = "YYYY-MM-DD" }` を足す。
# **`retired.by` が空の行でテストが消えていれば落ちる**——つまり
# **覆す側のイシューを名指しできないなら、それは仕様変更ではない。**
#
# ## min_entries は「黙って行を消す」を止めるためにある
#
# 行を消せば、その行に関する検査は何も走らない。だから**行数の下限を台帳自身に持たせる**。
# 消す側は min_entries を下げるしかなく、**その差分はレビューで見える**。
# `retired` で畳めば行は残るので、下限は下がらない。
#
# ## 並び順
#
# issue → behavior の昇順。**位置ではなく名前で並べる**（行が動いても並びが変わらない）。

min_entries = 0
