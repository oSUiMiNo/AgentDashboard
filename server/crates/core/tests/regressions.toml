  { file = "server/crates/core/src/client/wait.rs", name = "枝分かれはその枠で待ち時間切れに裏で続いていることを添える" },
  { file = "server/crates/core/tests/branch.rs", name = "cliの枝分かれは元の起こし直しの競合の知らせで落ちず段取りの完了まで待つ" },
