verified    = true

[[entry]]
issue       = "寝ているカードばかりなのに、メモリ不足でセッションを起こせない"
behavior    = "CLI で終了を待つとき、満ちるのは終了の頼みで起こし直しを取り下げた断りだけで、それも実体の無いカードに限る。メモリ不足・確かめられなかった・外した・競合の断りでは満ちも落ちもせず、生きた実体があれば「終了」を待つ。取り下げの理由（withdrawn）は PC→サーバ→ブラウザ・CLI のどの段でも落ちない（ローカル・セルフホスト・サーバをまたぐ配置とも）"
gate        = "unit"
tests       = [
  { file = "server/crates/core/src/client/wait.rs", name = "終了待ちは終了の頼み以外の起こし直しの断りでは満ちない" },
  { file = "server/crates/core/src/client/wait.rs", name = "終了待ちは生きた実体があれば取り下げの断りでは満ちず終了を待つ" },
  { file = "server/crates/core/src/client/wait.rs", name = "終了待ちは起こし直しが終わった断りで止まったと満ち競合では待ち続ける" },
  { file = "server/crates/protocol/src/ws.rs", name = "取り下げの理由は綴りのまま運ばれ_欠けと知らない綴りは取り下げではないと読む" },
  { file = "server/crates/protocol/src/a2s.rs", name = "取り下げの理由を持たない古い_pc_の知らせは取り下げではないと読む" },
  { file = "server/crates/core/tests/a2s.rs", name = "接続断のカードを起こし直しの確かめ中に終了させると_CLI_は止まったと返し_PC_は起こさない" },
  { file = "server/crates/server-core/tests/cluster.rs", name = "終了の頼みで取り下げた断りは理由を落とさず跨いで届く" },
  { file = "server/crates/core/tests/restart.rs", name = "作業中のまま残った抜け殻を確かめ中に終了させると待ち切らずに止まる" },
]
breaks_when = "wait.rs の終了の待ちの判定を、旧来の revive_refusal_of（終わった断りなら何でも）へ戻す（wait.rs の「終了待ちは終了の頼み以外の起こし直しの断りでは満ちない」が★メモリ不足の断りで、終了の待ちが満ちたか落ちた で落ちる）。実体の有無を見ずに取り下げで満ちる形（Some(false) → _）にする（「終了待ちは生きた実体があれば取り下げの断りでは満ちず終了を待つ」が★生きた実体があるのに、取り下げの断りで止まったと言っている）。gateway.rs の中継で withdrawn を None に落とす（cluster の「終了の頼みで取り下げた断りは理由を落とさず跨いで届く」が★跨いだ先で、終了の頼みで取り下げた断りとして読めない、a2s の1本が★取り下げの断りが終了の頼みとして読めず、CLI が上限まで待ち続けている）。link.rs で理由を None にする（a2s の1本が同じ★）。local.rs で理由を None にする（restart の1本が★終了の頼みが、起こし直しを止めた後も上限まで待ち続けている）。いずれも直した担当が実測した。自分でも wait.rs の kill_withdrawal_of で見分ける条件を false にして、そのカードの起こし直しの断りを全部満ちる側へ通し、「終了待ちは終了の頼み以外の起こし直しの断りでは満ちない」が★メモリ不足の断りで、終了の待ちが満ちたか落ちた（実体がある：false）で、第3回の「終了待ちは起こし直しが終わった断りで止まったと満ち競合では待ち続ける」が「競合で満ちも落ちもしないこと」で落ちることを当て直した"
verified    = true
retired     = { by = "寝ているカードばかりなのに、メモリ不足でセッションを起こせない", on = "2026-10-01" }

[[entry]]
issue       = "寝ているカードばかりなのに、メモリ不足でセッションを起こせない"
behavior    = "CLI で終了を待つとき、頼みの番号が付いた答えでだけ決まり、写しの状態・起こし直しの取り下げの断り・他の頼みや番号の無い断りでは満ちも落ちもせず、届かなかった断り（持ち主の門・配送の失敗）は番号付きで返ってその場で落ちる。番号と答えは PC→サーバ→CLI のどの段でも落ちない"
gate        = "unit"
tests       = [
  { file = "server/crates/core/src/client/wait.rs", name = "終了待ちは自分の番号を含む断りでだけ落ち配送の失敗を成功に変えない" },
  { file = "server/crates/core/src/client/wait.rs", name = "終了待ちは終了の頼み以外の起こし直しの断りでは満ちない" },
  { file = "server/crates/core/src/client/wait.rs", name = "終了待ちは生きた実体があれば取り下げの断りでは満ちず終了を待つ" },
  { file = "server/crates/core/src/client/wait.rs", name = "終了は番号を振って送りその番号で待つ" },
  { file = "server/crates/core/tests/cli_ops.rs", name = "持ち主の門で断られた番号付きの終了はその場で落ちる" },
  { file = "server/crates/server-core/tests/registry.rs", name = "終了の答えは記録と合わせて合否にし番号を添えて配る" },
  { file = "server/crates/server-core/tests/cluster.rs", name = "終了の答えは跨いだ先で番号付きの状態として届く" },
  { file = "server/crates/core/tests/a2s.rs", name = "接続断のカードを起こし直しの確かめ中に終了させると_CLI_は止まったと返し_PC_は起こさない" },
  { file = "server/crates/protocol/src/ws.rs", name = "頼みの番号は欠けても読め_無ければ書き出さず_あれば綴りのまま往復する" },
  { file = "server/crates/protocol/src/a2s.rs", name = "頼みの番号と終了の答えは欠けても読め_知らない答えは成功と読まない" },
]
breaks_when = "次を壊して、それぞれ狙った検査で落ちることを確かめた（第6回）。wait.rs で写しが Ended のときに種別 kill の断りを成功に変える以前の規則を戻す（wait.rs の「終了待ちは自分の番号を含む断りでだけ落ち…」が「★終了の頼みが届かなかった断りを、成功に変えている」）。wait.rs で終了の頼みで取り下げた起こし直しの断り（withdrawn: kill）で満ちる以前の規則を戻す（wait.rs の2本が「★終了の頼みで取り下げたの起こし直しの断りで…」「★生きた実体があるのに、取り下げの断りで止まったと言っている」）。ws.rs の持ち主の門の断りから番号を外す（cli_ops の1本が「★門の断りに終了の頼みの番号が無く、CLI が上限まで待ち続けている」）。gateway.rs で KillAnswer を捨てる（cluster の1本が「番号付きの状態 が届きませんでした」、a2s の1本が上限まで待って Elapsed）。registry.rs の answer_kill で「何も無かった」を常に成功にする（registry の1本が★）"
verified    = true

[[entry]]
issue       = "寝ているカードばかりなのに、メモリ不足でセッションを起こせない"
behavior    = "CLI で起こし直しを待つとき、写しが何枚届いても満ちず（連絡係を使う構成で2枚届いても）、頼みの番号が付いた答えで満ち、断りはどの道（門・動いている・呼び戻し先が無い・競合・届かない・PC の断り）でも番号を運んでその場で落ちる。古い相手と混ざったときは時間切れで終わり、起こせたとは言わない"
gate        = "unit"
tests       = [
  { file = "server/crates/core/src/client/wait.rs", name = "起こし直しは写しが何枚届いても番号の付いた答えでだけ満ちる" },
  { file = "server/crates/core/src/client/wait.rs", name = "起こし直しは自分の番号を含む断りでその場で落ち他の断りは聞き流す" },
  { file = "server/crates/core/src/client/wait.rs", name = "起こし直しの時間切れは答えが届かなかっただけかもしれないことと確かめ方を添える" },
  { file = "server/crates/core/src/client/wait.rs", name = "起こし直しは番号を振って送りその番号で待つ" },
  { file = "server/crates/session-host-core/tests/session_revive.rs", name = "番号付きの起こし直しは実体を作り終えたら番号付きで1回だけ答え番号の無い頼みには答えない" },
  { file = "server/crates/server-core/tests/registry.rs", name = "起こし直しの成功の答えは記録の状態に番号を添えて配り記録が無ければ番号付きで断る" },
  { file = "server/crates/server-core/tests/cluster.rs", name = "起こし直しの答えは跨いだ先で番号付きの状態として届く" },
  { file = "server/crates/server-core/tests/cluster.rs", name = "別のインスタンスに繋がった_PC_の抜け殻も起こし直せる" },
  { file = "server/crates/core/tests/cli_ops.rs", name = "起こし直しの断りは時間切れを待たずに一で落ちる" },
  { file = "server/crates/core/tests/restart.rs", name = "動いているカードは起こし直せない" },
  { file = "server/crates/core/tests/restart.rs", name = "抜け殻のカードは同じidのまま起こし直せる" },
]
breaks_when = "次を壊して、それぞれ狙った検査で落ちることを確かめた（第6回）。wait.rs で写しを1枚だけ見送り、その後の「起動中かつ繋がっている」写しで満ちる以前の形を戻す（wait.rs の1本が「★2枚目の写しで満ちた」）。session/mod.rs の revive で作り終えても答えない（session_revive の1本が「★実体を作り終えたのに、番号付きで答えていない」）。gateway.rs で ReviveAnswer を捨てる（cluster の1本が「番号付きの状態 が届きませんでした」）。ws.rs の「動いている」の断りから番号を外す（cli_ops の1本と restart の「動いているカードは起こし直せない」が 125 秒の時間切れで落ちる）。local.rs の revive_answered で答えを運ばない（restart の「抜け殻のカードは同じidのまま起こし直せる」が 125 秒の時間切れで落ちる）"
verified    = true

