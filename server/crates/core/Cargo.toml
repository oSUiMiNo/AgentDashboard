[package]
# パッケージ名を `core` にすると標準ライブラリの `core` と名前が衝突し、`use core::...` が
# どちらを指すのか曖昧になる。ディレクトリは設計§2 どおり crates/core のまま、名前だけ
# 衝突しないものにしている。
name = "agentdashboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "agentdashboard_core"
path = "src/lib.rs"

# 実行ファイルはここには無い。3本を1つのアーカイブへ入れるため、`crates/dist` が
# まとめて持っている（セルフホスト化設計§25 読み替え1）。コマンドラインの解釈まで
# 含めて中身は `src/cli.rs` にあり、あちらは呼び出しの1行だけ。

[dependencies]
protocol.workspace = true
agent-core.workspace = true
server-core.workspace = true
# 境界（server_core::agent::AgentHost）をローカル直結で実装するために使う
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
toml.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
testkit.workspace = true
# **DB 断を注入するためだけ**に使う（tests/offsets.rs）。製品コードから DB を触るのは
# server-core の仕事で、その境界は crates/core/tests/dependencies.rs が見張っている。
# 落ちたときの振る舞い（位置を進めない）は、本当に落として確かめないと固められない
sea-orm.workspace = true
# 2プロセス構成の端から端テストで、**ブラウザの役**として繋ぐために使う
# （製品コードの server-core は WebSocket クライアントを持たない）
tokio-tungstenite.workspace = true
futures-util.workspace = true
# 統合テストだけが直に使う。**通常の依存には入れない** — 製品コードから PTY を触るのは
# agent-core の仕事で、その境界は crates/core/tests/dependencies.rs が見張っている
portable-pty.workspace = true
# 画面配信のテストで**ブラウザ（xterm.js）の役**をさせる。届いたフレームを同じ意味論で
# 書き戻し、画面が再現できることを機械で確かめるために使う（設計§7-3）
vt100.workspace = true
uuid.workspace = true
