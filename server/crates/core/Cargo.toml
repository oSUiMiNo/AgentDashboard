[package]
# パッケージ名を `core` にすると標準ライブラリの `core` と名前が衝突し、`use core::...` が
# どちらを指すのか曖昧になる。ディレクトリは設計§2 どおり crates/core のまま、名前だけ
# 衝突しないものにしている。
name = "agentdashboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "agentdashboard_core"
path = "src/lib.rs"

# 実行ファイルはここには無い。3本を1つのアーカイブへ入れるため、`crates/dist` が
# まとめて持っている（セルフホスト化設計§25 読み替え1）。コマンドラインの解釈まで
# 含めて中身は `src/cli.rs` にあり、あちらは呼び出しの1行だけ。

[dependencies]
protocol.workspace = true
session-host-core.workspace = true
server-core.workspace = true
# 境界（server_core::agent::SessionHost）をローカル直結で実装するために使う
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
toml.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
# CLI がダッシュボードを叩く HTTP の1往復（CLI設計§6-1）。ブラウザと同じ席に座る側
# なので、置き場所はサーバ側でも PC 側でもなくここになる（CLI設計§2-1）。
# 接続プールは持たない——1回の呼び出しで「繋ぐ→送る→切る」を閉じる（CLI設計§1-2）
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
# `--server https://…` のときだけ通す TLS（CLI設計§6-1）。実装はセッションホストの
# A2S（tokio-tungstenite の rustls-tls-webpki-roots）が既にビルドしているものと同じ
tokio-rustls.workspace = true
webpki-roots.workspace = true
# CLI の操作系がダッシュボードへ話しかける WebSocket（CLI設計§7-1）。もとは
# 2プロセステストの**ブラウザの役**として dev 側に居たが、その役がそのまま製品になった。
# feature（rustls-tls-webpki-roots）はセッションホストの A2S と同じ組なので、
# `agentdashboard-agent` の嵩は動かない（動かないことは実行レポートの再計測で確かめる）
tokio-tungstenite.workspace = true
futures-util.workspace = true
# `session screen` が 0x03 のエスケープ列をテキストへ直すのに使う（CLI設計§9-1）。
# もとはテストの**ブラウザの役**として dev 側に居たが、その役がそのまま製品になった
# （tokio-tungstenite と同じ経緯）。feature はセッションホスト側と同じなので嵩は動かない
vt100.workspace = true
# 自分の子を畳んで引き取るのに使う（ゾンビ設計§6-2）。`waitpid` と `kill` は標準ライブラリに
# 無い。**版の入れ替えは `exec` で自分を置き換えるので、その手前で片付けないと引き取る
# 手立てごと消える**——だから、この1点のためだけに入れている
libc.workspace = true

[dev-dependencies]
testkit.workspace = true
# **DB 断を注入するためだけ**に使う（tests/offsets.rs）。製品コードから DB を触るのは
# server-core の仕事で、その境界は crates/core/tests/dependencies.rs が見張っている。
# 落ちたときの振る舞い（位置を進めない）は、本当に落として確かめないと固められない
sea-orm.workspace = true
# 統合テストだけが直に使う。**通常の依存には入れない** — 製品コードから PTY を触るのは
# session-host-core の仕事で、その境界は crates/core/tests/dependencies.rs が見張っている
portable-pty.workspace = true
uuid.workspace = true
