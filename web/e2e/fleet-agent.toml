# PC を3台つないだ検証：**セッションホスト**（セルフホスト化設計§26 読み替え3）。
#
# # 3台ぶんあるのに設定ファイルは1枚
#
# 台ごとに違うのは3つ（名前・状態の置き場所・claude 設定の置き場所）だけで、
# それは `scripts/e2e-fleet` が**環境変数で上書き**して渡す。全キーが
# `AGENTDASHBOARD_<大文字のキー>` で設定できることはフェーズ7 で機械検査に
# してあるので、そこへ乗るだけで済む。
#
# ファイルを台数ぶん置くと、**台数を変えるたびに枚数が増える**。1枚にしておけば
# 変えるのはスクリプトの繰り返し回数だけになる。

server_url = "http://127.0.0.1:4177"

# statusLine の再実行間隔。既定の3秒だと切替の確認だけで毎回3秒待つ
status_line_refresh_secs = 1

# 自己修復は E2E の対象外。走らせると擬似 claude でカナリアが失敗し続ける
selfheal_enabled = false
