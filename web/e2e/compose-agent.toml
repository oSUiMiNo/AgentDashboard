# インスタンス2台構成の E2E：**PC 側エージェント**（セルフホスト化設計§15-2 #4）。
#
# 繋ぎ先とトークンは `scripts/e2e-compose` が環境変数で渡す
# （`AGENTDASHBOARD_SERVER_URL` / `AGENTDASHBOARD_PAIRING_TOKEN`）。
# **繋ぐのは B（4176）**で、ブラウザが繋ぐ A（4175）とは別のインスタンスになる。

agent_name = "compose用PC"

# 置き場所を他の E2E と分ける。同じ場所を指すと、再開位置を取り合うことになる
state_dir = "web/test-results/compose/agent"

# 利用者のグローバル設定を絶対に触らせない（他の E2E と同じ理由）
claude_settings_path = "web/test-results/compose/agent/claude-settings.json"

# statusLine の再実行間隔。既定の3秒だと切替の確認だけで毎回3秒待つ
status_line_refresh_secs = 1

# 自己修復は E2E の対象外。走らせると擬似 claude でカナリアが失敗し続ける
selfheal_enabled = false
