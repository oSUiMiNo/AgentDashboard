# E2E 用の設定（設計§12 のキーをそのまま使う）。
#
# 既定値のままだと、フロー制御が働くまでに数百MBの出力が必要になりテストが重くなる。
# しきい値とスクロールバックだけを小さくして、同じ仕組みを短時間で観測できるようにしている。
# コアレッシングの窓は既定のまま（この値を変えると測っているものが変わるため）。

port = 4173

# 状態の置き場所をテスト専用にする。
#
# 既定は `$XDG_STATE_HOME/agentdashboard`＝**利用者が普段使っている場所**なので、
# 指定しないと E2E がパーサの再開位置や自己修復の記録（対応表・クールダウン）を
# 実運用と共有してしまう。E2E の擬似 claude が採れないカナリアの失敗が、実運用の
# 自己修復を24時間止める、といった形で表に出る。
state_dir = "test-results/state"

pty_ring_buffer = 262144
flow_high = 65536
flow_low = 8192

# 設定画面の書き戻し先。E2E は毎回 false へ戻すが、キーを先に置いておくと
# 書き戻しが「値の差し替え」になり、追記でファイルが伸びていかない
always_bypass_permissions = false
