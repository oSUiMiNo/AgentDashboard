# E2E 用の設定（設計§12 のキーをそのまま使う）。
#
# 既定値のままだと、フロー制御が働くまでに数百MBの出力が必要になりテストが重くなる。
# しきい値とスクロールバックだけを小さくして、同じ仕組みを短時間で観測できるようにしている。
# コアレッシングの窓は既定のまま（この値を変えると測っているものが変わるため）。

port = 4173

# 状態の置き場所をテスト専用にする。
#
# 既定は `$XDG_STATE_HOME/agentdashboard`＝**利用者が普段使っている場所**なので、
# 指定しないと E2E がパーサの再開位置や自己修復の記録（対応表・クールダウン）を
# 実運用と共有してしまう。E2E の擬似 claude が採れないカナリアの失敗が、実運用の
# 自己修復を24時間止める、といった形で表に出る。
#
# **`test-results/` の下には置けない。** Playwright は走る前にあそこを丸ごと消すが、
# `reuseExistingServer` で前回のサーバが生き残るので、**消えたファイルへ気づかない
# まま書き続ける**ことになる（書き手は死なず、書き込みも失敗せず、ただ誰からも
# 読めない場所へ流れ続ける。ログ設計§19-8 で実測）。ログがここへ落ちるようになった
# 段1 から、これが実害になった
state_dir = ".e2e-state/state"

# 利用者のグローバル設定を**絶対に触らせない**。
#
# モデルを切り替えると CLI がこのファイルを書き換えるので、指定しないと E2E が
# 実運用の ~/.claude/settings.json を読み書きすることになる。state_dir と同じ理由で、
# テスト専用の場所を指す。
#
# **中身は `e2e/global-setup.ts` が起動前に必ず用意する。** 以前はここを空のまま
# （存在しないファイルのまま）にしていたが、それだと注入も回復も一度も動かず、
# モデルのテストが「実装を消しても通る」状態になっていた。
#
# ただし E2E で確かめられるのは**注入まで**である。本物の CLI と違って擬似 claude は
# このファイルを汚さないので、回復（汚れた値の書き戻し）は走らない。そちらは
# `crates/core/tests/model.rs` と `claude_settings.rs` の単体テストが担保している。
claude_settings_path = ".e2e-state/state/claude-settings.json"

# statusLine の再実行間隔。既定の3秒だと切替の確認だけで毎回3秒待つことになる
status_line_refresh_secs = 1

pty_ring_buffer = 262144
flow_high = 65536
flow_low = 8192

# 記録に行が無いときの初期値（持ち出し設計§3）。**設定画面はここへ書き戻さない**。
# E2E は毎回 false へ戻すが、それは記録のほうを戻している
always_bypass_permissions = false
