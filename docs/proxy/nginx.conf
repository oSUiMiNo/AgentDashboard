# AgentDashboard を nginx の後ろに置く（セルフホスト化設計§14-2）。
#
# **このファイルは検証で実際に使われている。** `make e2e-compose` が同じものを nginx へ
# 読ませ、セッションホストがこの経路でサーバへ繋げることを確かめる
# （`docker/compose.e2e.yml`）。手順書に貼った例ではなく、動いている設定そのもの。
#
# 置き場所は `/etc/nginx/conf.d/agentdashboard.conf`。`http { }` の中へ読み込まれる前提の
# 書き方にしてある。
#
# # 変えるのは2箇所
#
# | 行 | いまの値 | 何に変えるか |
# |---|---|---|
# | `server_name` | `_`（何でも受ける） | 自分のドメイン |
# | `proxy_pass` | `dashboard:8787` | ダッシュボードのアドレス |
#
# TLS はここでは書いていない。証明書を入れたら `listen 443 ssl;` を足し、
# ダッシュボード側へ `AGENTDASHBOARD_COOKIE_SECURE=true` を渡すこと——付けないと、
# HTTPS で開いているのに入館証が平文でも送られる。
#
# # WebSocket は「通す」と書かないと通らない
#
# nginx は既定で HTTP/1.0 に落として転送するので、**Upgrade がそのままでは通らない**。
# 下の3行（`http_version` と2つのヘッダ）が要る。ダッシュボードは WebSocket を**2本**
# 使う——ブラウザ用の `/ws` とセッションホスト用の `/agent/ws`。片方だけ通す設定に
# すると、「画面は出るのに PC が繋がらない」「PC は繋がるのに画面が動かない」という
# 半分だけ動く状態になる。ここでは場所で分けず、まとめて通している。

# Upgrade が無い普通の要求では `Connection: close` を送る。
# `Connection: upgrade` を固定で書くと、通常の要求まで壊れる
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 画面の初期表示に少し大きめの応答が乗るので、既定より緩めておく
    client_max_body_size 16m;

    location / {
        proxy_pass http://dashboard:8787;

        # WebSocket（`/ws` と `/agent/ws`）を通すための3行
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **X-Forwarded-For は渡さない。** ダッシュボードは接続元をヘッダから
        # 判断しない（設計§8-3）——LAN からの免除を、誰でも書けるヘッダで
        # 取れてしまうため。渡しても使われないので、無い方が誤解が無い

        # ターミナルは**何も起きない時間**が長い。既定の60秒だと、待っている間に
        # 接続が切られて画面が止まったように見える
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
