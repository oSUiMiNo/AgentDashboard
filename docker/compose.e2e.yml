# インスタンスを2台並べた検証用の構成（セルフホスト化設計§15-2 #4）。
#
# 本番構成（`compose.yml`）との違いは3つだけ。
#
# | | 本番 | ここ |
# |---|---|---|
# | dashboard | 1台 | **2台**（別々のポートで公開する） |
# | PostgreSQL のデータ | 残す | 毎回捨てる（`down --volumes`） |
# | 再起動 | unless-stopped | しない（落ちたら落ちたと分かるように） |
#
# **2台を別のポートで公開するのが要点。** ブラウザは A、PC は B、という配置を作れて
# 初めて「別インスタンスに接続していてもターミナル操作が成立」（検収条件）が確かめられる。
# 前段で振り分けてしまうと、どちらに繋がったのかテストから決められない。
#
# 起動と後片付けは `scripts/e2e-compose`（`make e2e-compose`）が面倒を見る。

name: agentdashboard-e2e

x-dashboard: &dashboard
  build:
    context: ..
    dockerfile: docker/Dockerfile.server
  image: agentdashboard/server
  environment: &dashboard-env
    AGENTDASHBOARD_BIND_ADDR: 0.0.0.0
    DATABASE_URL: postgres://agentdashboard:agentdashboard@postgres:5432/agentdashboard
    VALKEY_URL: redis://valkey:6379
    RUST_LOG: info
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }
  healthcheck:
    # **鍵の外側の口で見る。** `/api/sessions` は鍵の向こうなので、待ちに使うと
    # 「まだ起きていない」と「ログインしていない」が同じ 401 になり永久に待つ
    test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:8787/api/me']
    interval: 2s
    timeout: 3s
    retries: 30

services:
  dashboard-a:
    <<: *dashboard
    ports:
      - '4175:8787'

  dashboard-b:
    <<: *dashboard
    ports:
      - '4176:8787'
    networks:
      default:
        # **前段（Caddy・nginx）から見た名前。** 手順書に載せる設定ファイルを
        # そのまま読ませるために、あちらが書いている転送先の名前をここで用意する
        # （設計§25 読み替え4）。別名を作らないと、手順書側を「compose 用の名前」へ
        # 書き換えることになり、**利用者が読むものと動かすものが別物**になる
        aliases:
          - dashboard

  # 手順書（`docs/setup/reverse-proxy.md`）に載せる設定の実物を読ませる。
  # **前に置くのは B**——セッションホストが繋がっている側なので、ブラウザ用の `/ws` と
  # PC 用の `/agent/ws` の両方をこの1台で通せる。
  caddy:
    image: caddy:2-alpine
    volumes:
      - ../docs/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '4177:80'
    depends_on:
      dashboard-b: { condition: service_healthy }

  nginx:
    image: nginx:1-alpine
    volumes:
      # `conf.d` の中は `http { }` へ読み込まれる。手順書もその置き場所を案内している
      - ../docs/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '4178:80'
    depends_on:
      dashboard-b: { condition: service_healthy }

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agentdashboard
      POSTGRES_PASSWORD: agentdashboard
      POSTGRES_DB: agentdashboard
    # **tmpfs にしてはいけない。** 止めた瞬間に中身ごと消えるので、DB 断の検証が
    # 「落ちて戻った」ではなく「まっさらになった」になる——マイグレーションは起動時に
    # しか走らないので、表が無いまま誰も直せない状態で固まる（実際に踏んだ）。
    # 名前付きの置き場所にして、片付けは `down --volumes` に任せる
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentdashboard -d agentdashboard']
      interval: 1s
      timeout: 3s
      retries: 60

  valkey:
    image: valkey/valkey:9.1-alpine
    command: ['valkey-server', '--save', '']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  # 毎回捨てる。捨てるのは `scripts/e2e-compose` の `down --volumes`
  pgdata:
