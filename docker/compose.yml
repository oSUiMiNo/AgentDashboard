# セルフホストの本番構成（セルフホスト化設計§14-1）。
#
# `docker compose -f docker/compose.yml up -d` で立つ。スキーマは起動時に自動で
# 当たる（`MigratorTrait::up`）ので、マイグレーションのコマンドを手で叩く工程は無い。
#
# # 立てたあとにやること
#
# 1. ブラウザで `http://<ホスト>:8787/setup` を開き、最初の管理者を作る
# 2. アカウント画面でペアリングトークンを発行する
# 3. 利用者の PC で `agentdashboard-agent` を起動し、そのトークンを渡す
#
# TLS は**この構成に含めない**。前段にリバースプロキシを置いて終端する（§14-2）。
# その場合は `AGENTDASHBOARD_COOKIE_SECURE=true` を足すこと——付けないと、
# HTTPS で開いているのに Cookie が平文でも送られる。
#
# # インスタンスを増やすとき
#
# `dashboard` を複数立てて前段で振り分ける。**そのときだけ Valkey が要る**
# （1台なら配信はプロセスの中で完結するので、`VALKEY_URL` は無くてよい）。
# 揃えるのは `DATABASE_URL` と `VALKEY_URL` の2つで、それ以外は台ごとに違ってよい。

name: agentdashboard

services:
  dashboard:
    # **ここで作らない。** `build:` を書くと、箱が手元に無いとき Docker は
    # 自分で作ろうとする——材料（ソース）を持っているのは開発者だけなので、
    # 献立表1枚だけ取ってきた利用者はそこで詰まる（設計§26 読み替え2）。
    #
    # **版は固定する。** `latest` にすると、取り直しただけで記録の表の形まで
    # 上がってしまう（起動時に自動で当たる）。戻す道は用意していないので、
    # 上げるかどうかは利用者が決める形にしてある。
    # 版を上げるときは `docker/compose.yml` のここを書き換えて `pull` する。
    # ワークスペースの版と食い違っていないことは `make ci` が見ている
    image: ghcr.io/osuimino/agentdashboard:0.1.42
    environment:
      # 待ち受けを広げないとコンテナの外から届かない。**鍵はアカウントのログイン**
      # なので、広げること自体は危険ではない（設計§8-1）
      AGENTDASHBOARD_BIND_ADDR: 0.0.0.0
      # 慣行に合わせて裸の名前でも受ける（`AGENTDASHBOARD_` 付きが勝つ）
      DATABASE_URL: postgres://agentdashboard:agentdashboard@postgres:5432/agentdashboard
      VALKEY_URL: redis://valkey:6379
      RUST_LOG: info
      # 記録の置き場所を**名指しする**（ログ設計§25-10）。
      #
      # 書かないと `HOME` から組み立てられる（いまは root なので
      # `/root/.local/state/agentdashboard`）。**箱の中の人が変わった瞬間に場所が動く**
      # ので、下の volume の当て先も一緒にずれる。名指ししておけば、誰で走っても同じ
      AGENTDASHBOARD_STATE_DIR: /var/lib/agentdashboard
    volumes:
      # **ログをここへ残す。** 無いと書き込み層に落ちるので、`up -d` で箱を作り直す
      # たびに消える——「更新したら壊れた、更新前を見たい」という、いちばん需要のある
      # 場面でいちばん困る形になる（記録は PostgreSQL 側なので、消えるのはログだけ）。
      #
      # 掃除は**起動時に1回だけ**走る（設計§6-2）。長く動かしている箱では
      # `log_max_bytes` を超えても起こし直すまで掃かれないので、既定値の見直しが
      # 要るかどうかはフェーズ6 の§18-3 で決める
      - dashboard-state:/var/lib/agentdashboard
    ports:
      - '8787:8787'
    healthcheck:
      # **鍵の外側の口で見る。** `/api/sessions` は鍵の向こうなので、待ちに使うと
      # 「まだ起きていない」と「ログインしていない」が同じ 401 になり永久に待つ
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:8787/api/me']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    # PG18 からデータの置き場所が /var/lib/postgresql に変わった。
    # **/data を付けた旧来の書き方は壊れる**（起動はするが毎回空になる）
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agentdashboard
      POSTGRES_PASSWORD: agentdashboard
      POSTGRES_DB: agentdashboard
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # 待たずに繋ぐと「まだ起動中」を接続失敗と読み違える
      test: ['CMD-SHELL', 'pg_isready -U agentdashboard -d agentdashboard']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1-alpine
    # pub/sub 専用。**永続化は要らない**——耐久データは DB にあり、ここを流れるのは
    # 揮発の知らせだけ（設計§9-1）。保存しようとするとディスクを食うだけになる
    command: ['valkey-server', '--save', '']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  # ダッシュボードの記録（ログ・版の保管庫）。**DB とは別**——あちらは PostgreSQL が
  # 持っているので、ここに入るのは箱が自分のために書いたものだけ
  dashboard-state:
